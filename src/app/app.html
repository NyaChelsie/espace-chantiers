<header class="text-white">
  <div class="flex flex-wrap items-center justify-between gap-4 bg-slate-900 px-6 py-4">
    <a routerLink="/" class="text-xl font-bold">
      ETS de l'Éternel <span class="text-amber-500">Bâti</span>
    </a>

    <nav class="flex flex-wrap gap-6 text-sm">
            <a
        routerLink="/"
        routerLinkActive="font-semibold text-amber-400 underline underline-offset-8"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'exact',
        }"
      >
        Accueil
      </a>
      <a
        routerLink="/realisations"
        routerLinkActive="font-semibold text-amber-400 underline underline-offset-8"
      >
        Réalisations
      </a>
      <a
        *appSeulementPour="['client', 'admin']"
        routerLink="/espace-client"
        routerLinkActive="font-semibold text-amber-400 underline underline-offset-8"
      >
        Espace client
      </a>
      <a
        *appSeulementPour="['admin']"
        routerLink="/admin"
        routerLinkActive="font-semibold text-amber-400 underline underline-offset-8"
      >
        Admin
      </a>
                 <a
        routerLink="/"
        fragment="contact"
        routerLinkActive="font-semibold text-amber-400 underline underline-offset-8"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'exact',
        }"
      >
        Contact
      </a>
    </nav>

    <a
      routerLink="/espace-client/demande-devis"
      class="rounded bg-amber-500 px-4 py-2 text-sm font-semibold text-black"
    >
      Devis gratuit
    </a>
  </div>

  <!-- TEMPORAIRE : outils de test des guards. À SUPPRIMER après les tests. -->
  <div class="flex flex-wrap items-center gap-3 bg-slate-950 px-6 py-2 text-xs">
    <span>
      État :
      @if (auth.connecte()) {
        connecté ({{ auth.role() }})
      } @else {
        déconnecté
      }
    </span>
    <button class="rounded bg-slate-600 px-2 py-1" (click)="auth.connecterClient()">
      Connexion client
    </button>
    <button class="rounded bg-slate-600 px-2 py-1" (click)="auth.connecterAdmin()">
      Connexion admin
    </button>
    <button class="rounded bg-slate-600 px-2 py-1" (click)="deconnecter()">
      Se déconnecter
    </button>
    <a routerLink="/admin" class="underline">Test /admin</a>
    @if (enChargement()) {
      <span class="font-semibold text-amber-300">Chargement…</span>
    }
  </div>
</header>

@if (notification.message(); as m) {
  <div class="p-2">
    <p
      class="rounded p-2"
      [class]="
        m.type === 'erreur'
          ? 'bg-red-100 text-red-800'
          : m.type === 'succès'
            ? 'bg-green-100 text-green-800'
            : 'bg-blue-100 text-blue-800'
      "
    >
      {{ m.texte }}
    </p>
  </div>
}

<main class="min-h-screen bg-slate-100">
  <router-outlet />
</main>
