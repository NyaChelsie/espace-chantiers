<header class="bg-slate-800 p-4 text-white">
  <nav class="mb-3 flex gap-4">
    <a
      routerLink="/"
      routerLinkActive="font-bold underline"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Accueil
    </a>
    <a routerLink="/realisations" routerLinkActive="font-bold underline">Réalisations</a>
    <a
      *appSeulementPour="['client', 'admin']"
      routerLink="/espace-client"
      routerLinkActive="font-bold underline"
    >
      Espace client
    </a>
    <a *appSeulementPour="['admin']" routerLink="/admin" routerLinkActive="font-bold underline">
      Admin
    </a>
    <!-- TEMPORAIRE : pour le scénario 14. À SUPPRIMER après le test. -->
    <a routerLink="/admin">Test /admin</a>
  </nav>

  @if (enChargement()) {
    <p class="mb-2 font-semibold text-amber-300">Chargement…</p>
  }

  <p>
    État :
    @if (auth.connecte()) {
      connecté ({{ auth.role() }})
    } @else {
      déconnecté
    }
  </p>
  <div class="mt-2 flex gap-2">
    <button class="rounded bg-slate-600 px-3 py-1" (click)="auth.connecterClient()">
      Connexion client
    </button>
    <button class="rounded bg-slate-600 px-3 py-1" (click)="auth.connecterAdmin()">
      Connexion admin
    </button>
    <button class="rounded bg-slate-600 px-3 py-1" (click)="deconnecter()">
      Se déconnecter
    </button>
  </div>
</header>

@if (notification.message(); as m) {
  <div class="p-2">
    <p
      class="rounded p-2"
      [class]="
        m.type === 'erreur'
          ? 'bg-red-100 text-red-800'
          : m.type === 'succès'
            ? 'bg-green-100 text-green-800'
            : 'bg-blue-100 text-blue-800'
      "
    >
      {{ m.texte }}
    </p>
  </div>
}

<main class="p-4">
  <router-outlet />
</main>
